/* Layout: one study column; a "die" header strip, mode tabs, then the question card. Layer colours of a CMOS layout mark topics. */
:root {
  --bg: #f2f3f6;

  --fg: #1a1b26;

  --warn: #9a6400; --warn-soft: #fbefd6;
  --poly: #d4463c; --diff: #3c9a5a; --li: #3d7fc0; --well: #c9a227;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12131a; --surface: #1b1d27; --sunk: #242734; --fg: #e8e9f1; --muted: #9a9db0; --line: #323547;
  --accent: #a28cf5; --accent-soft: #2c2650;
  --ok: #5fcf8d; --ok-soft: #173525; --bad: #f08074; --bad-soft: #3d1d1a; --warn: #e7b24f; --warn-soft: #3a2c12;
  --poly: #ef6b60; --diff: #5fbf7d; --li: #6ea7e3; --well: #e0bd4c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12131a; --surface: #1b1d27; --sunk: #242734; --fg: #e8e9f1; --muted: #9a9db0; --line: #323547;
  --accent: #a28cf5; --accent-soft: #2c2650;
  --ok: #5fcf8d; --ok-soft: #173525; --bad: #f08074; --bad-soft: #3d1d1a; --warn: #e7b24f; --warn-soft: #3a2c12;
  --poly: #ef6b60; --diff: #5fbf7d; --li: #6ea7e3; --well: #e0bd4c; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; margin: 0; line-height: 1.1; text-wrap: balance; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: .85rem; }
.layers { display: flex; gap: 3px; margin-bottom: 8px; }
.layers i { width: 22px; height: 6px; border-radius: 2px; display: block; }
.meter { display: grid; gap: 6px; min-width: 220px; flex: 1 1 220px; max-width: 320px; }
.meter .bar { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; display: flex; }
.meter .bar span { display: block; height: 100%; }
.meter .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--sunk); padding: 4px; border-radius: 12px; }
.tabs button { border: 0; background: transparent; padding: 9px 6px; border-radius: 9px; font-weight: 600; font-size: .88rem; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tabs .count { font-family: var(--f-mono); font-size: .72rem; margin-left: 4px; color: var(--bad); }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.controls label { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
select { font: inherit; font-size: .88rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); max-width: 100%; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: .88rem; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #12131a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #12131a; } }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }

/* card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.qmeta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; letter-spacing: .02em; }
.chip::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--chip, var(--accent)); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.qtext { font-size: 1.08rem; font-weight: 600; line-height: 1.5; margin: 0; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 11px 12px; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { font-family: var(--f-mono); font-weight: 700; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--sunk); font-size: .85rem; }
.opt span:last-child { padding-top: 2px; min-width: 0; }
.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; }
.feedback { border-radius: var(--r); padding: 12px 14px; font-size: .92rem; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback b { display: block; margin-bottom: 2px; }
.feedback .ok-t { color: var(--ok); } .feedback .bad-t { color: var(--bad); }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hint { font-size: .75rem; color: var(--muted); }
.kbd { font-family: var(--f-mono); font-size: .72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty strong { color: var(--fg); font-size: 1.05rem; }
.progress-line { height: 4px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress-line span { display: block; height: 100%; background: var(--accent); transition: width .2s; }

/* exam */
.grid-nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; }
.grid-nav button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 0; font-family: var(--f-mono); font-size: .75rem; }
.grid-nav button.done { background: var(--accent-soft); border-color: var(--accent); }
.grid-nav button.cur { outline: 2px solid var(--accent); }
.grid-nav button.r { background: var(--ok-soft); border-color: var(--ok); }
.grid-nav button.w { background: var(--bad-soft); border-color: var(--bad); }
.timer { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.score { display: flex; flex-wrap: wrap; gap: 18px; align-items: baseline; }
.score .big { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.review-item { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; font-size: .9rem; }
.review-item .q { font-weight: 600; }
.review-item .you { color: var(--bad); } .review-item .ans { color: var(--ok); }

/* stats */
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 6px 14px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.trow .name { font-size: .88rem; min-width: 0; }
.trow .name small { color: var(--muted); font-family: var(--f-mono); }
.trow .bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; display: flex; }
.trow .bar span { height: 100%; }
.trow .pct { text-align: right; font-family: var(--f-mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
.trow .go { justify-self: end; }
.note { font-size: .82rem; color: var(--muted); margin: 0; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; }
@media (max-width: 480px) {
  .tabs button { font-size: .8rem; padding: 8px 2px; }
  .card { padding: 16px; }
  .qtext { font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const RAW = [{"t":"Introduction, History and Design Abstraction","q":[[1,"The first point-contact transistor was invented in 1947 at:",["Texas Instruments","Fairchild Semiconductor","Intel","Bell Laboratories"],3,"Bardeen và Brattain tại Bell Labs (Nobel 1956 cùng Shockley)."],[2,"Jack Kilby built the first integrated circuit in 1958 at:",["Bell Laboratories","IBM","Texas Instruments","Fairchild Semiconductor"],2,"Kilby làm ở Texas Instruments, nhận Nobel năm 2000."],[3,"Who invented the CMOS logic gate in 1963?",["William Shockley","Frank Wanlass","Robert Noyce","Gordon Moore"],1,"Frank Wanlass (Fairchild) ghép nMOS và pMOS thành CMOS."],[4,"Moore's Law originally observed that the number of transistors on a chip:",["increases linearly every year","doubles roughly every 18 months to 2 years","doubles every 10 years","halves every technology node"],1,"Số transistor trên chip tăng gấp đôi theo chu kỳ ~18–24 tháng."],[5,"Small-scale integration (SSI) refers to chips with fewer than about:",["10 gates","100 gates","1000 gates","10000 gates"],0,"SSI \u003c 10 cổng, MSI ≤ 1000, LSI ≤ 10000, trên nữa là VLSI."],[6,"The integration level with up to about 10,000 gates is called:",["SSI","MSI","LSI","ULSI"],2,"LSI ≤ 10k cổng."],[7,"The main reason CMOS replaced nMOS logic in the 1980s was:",["smaller transistors","nearly zero static power consumption","simpler fabrication","higher speed"],1,"Cổng CMOS gần như không tiêu thụ công suất tĩnh."],[8,"The main advantage of MOSFETs over bipolar transistors for large ICs is that MOSFETs:",["have higher gain","need no power supply","are faster at all sizes","draw almost no gate current in the idle state"],3,"Cổng MOS cách điện nên gần như không có dòng khi đứng yên → tích hợp được nhiều."],[9,"The \"feature size\" of a CMOS process usually refers to:",["the width of the top metal layer","the minimum transistor channel length that can be reliably built","the thickness of the gate oxide","the size of the wafer"],1,"Feature size ~ chiều dài kênh nhỏ nhất."],[10,"Each new technology node typically shrinks linear dimensions by about 30%, which:",["halves the transistor density","doubles the transistor density","keeps the density constant","quadruples the density"],1,"0.7 × 0.7 ≈ 0.5 diện tích → mật độ gấp đôi."],[11,"Around 2004, microprocessor clock frequencies stopped increasing rapidly mainly because of:",["the lack of lithography tools","the end of Moore's Law for transistor count","electromigration","the power wall"],3,"Power wall: công suất quá lớn, tần số dừng ~3 GHz, chuyển sang multicore."],[12,"Dennard scaling (1974) predicted that as transistors shrink they become:",["larger and more reliable","faster but consume more power per gate","slower but cheaper","faster, lower power and cheaper"],3,"Constant-field scaling: nhanh hơn, ít điện hơn, rẻ hơn."],[13,"Which is the correct order of design abstraction levels from highest to lowest?",["microarchitecture, architecture, circuit, logic","architecture, microarchitecture, logic, circuit, physical","physical, circuit, logic, architecture","logic, circuit, architecture, physical"],1,"Architecture → microarchitecture → logic → circuit → physical."],[14,"The architecture level of a design mainly defines:",["mask geometry","transistor sizes","the user's view of the system, e.g. the instruction set","the placement of standard cells"],2,"Kiến trúc = cái mà người dùng/lập trình viên thấy (ISA)."],[15,"Deciding how an architecture is partitioned into registers, datapath units and control is done at the:",["fabrication level","circuit level","microarchitecture level","physical level"],2,"Microarchitecture chia khối, pipeline, datapath."],[16,"The three domains of Gajski's Y-chart are:",["behavioral, structural, physical","RTL, gate, transistor","analog, digital, mixed","logic, circuit, layout"],0,"Y-chart: behavioral, structural, physical (geometrical)."],[17,"Which of the following is NOT one of the principles of structured design?",["randomness","modularity","hierarchy","regularity"],0,"Bốn nguyên tắc: hierarchy, regularity, modularity, locality."],[18,"Dividing a system into modules, then dividing each module into submodules, is called:",["abstraction inversion","locality","regularity","hierarchy"],3,"Hierarchy = phân cấp chia nhỏ."],[19,"Using a small number of identical cells (such as the same full adder in every bit) is an example of:",["locality","regularity","pipelining","modularity"],1,"Regularity = dùng lại các khối giống nhau."],[20,"Keeping signals within a module and minimizing global wires is the principle of:",["scalability","locality","hierarchy","regularity"],1,"Locality: hạn chế dây toàn cục, giao tiếp cục bộ."],[21,"Modularity means that each module:",["has well-defined functions and interfaces","uses only NAND gates","is placed in the chip corner","has exactly one output"],0,"Mỗi module có chức năng và giao diện rõ ràng."],[22,"The two most widely used hardware description languages are:",["C and Java","Python and Tcl","SPICE and GDSII","Verilog and VHDL"],3,"Verilog và VHDL."],[23,"A company that designs chips but owns no fabrication plant is called:",["a foundry","an IDM","a mask shop","fabless"],3,"Công ty fabless (thuê foundry như TSMC)."],[24,"A company such as TSMC that manufactures chips designed by others is called a:",["packaging house","foundry","EDA vendor","fabless company"],1,"Foundry."],[25,"Sending the final mask data to the manufacturer is called:",["tapeout","signoff simulation","synthesis","place and route"],0,"Tapeout."],[26,"MOSIS provides low-cost prototyping by:",["combining many small designs on one multi-project wafer","using only FPGAs","skipping design rule checks","building a dedicated mask set for each student"],0,"Multi-project wafer: nhiều thiết kế chia chung một bộ mask."],[27,"The cost of a chip is roughly proportional to its:",["number of I/O pins only","die area","clock frequency","number of transistors only"],1,"Giá chip tỉ lệ diện tích die (và yield)."],[28,"Typical modern production wafer diameter is:",["25 mm","75 mm","300 mm","1000 mm"],2,"Wafer hiện đại 300 mm."],[29,"A die is:",["an individual chip cut from the wafer","a photomask","a package pin","a complete wafer"],0,"Die = một chip cắt ra từ wafer."],[30,"In the book's MIPS example, what is the purpose of the microarchitecture-level design?",["to organize the datapath and control that implement the instruction set","to choose the transistor W/L","to draw polygon layout","to select the package type"],0,"Microarchitecture hiện thực ISA bằng datapath + controller."]]},{"t":"Semiconductors and MOS Transistor Theory","q":[[31,"Silicon is a Group ___ element.",["III","IV","V","VI"],1,"Si thuộc nhóm IV, có 4 electron hóa trị."],[32,"Doping silicon with arsenic (As) produces:",["p-type silicon","intrinsic silicon","n-type silicon","an insulator"],2,"As nhóm V là donor → n-type."],[33,"Doping silicon with boron (B) produces:",["polysilicon","silicon dioxide","p-type silicon","n-type silicon"],2,"B nhóm III là acceptor → p-type."],[34,"A Group V dopant is called a(n):",["isolator","donor","insulator","acceptor"],1,"Nhóm V cho thêm electron → donor."],[35,"The majority carriers in p-type silicon are:",["ions","photons","holes","electrons"],2,"p-type: hạt dẫn đa số là lỗ trống."],[36,"The majority carriers that form the channel of an nMOS transistor are:",["holes","electrons","neutrons","protons"],1,"Kênh nMOS là kênh electron."],[37,"A p-n junction diode conducts significant current when:",["both sides are at the same voltage","the p side is at a higher voltage than the n side","it is reverse biased","the n side is at a higher voltage than the p side"],1,"Forward bias: anode (p) cao hơn cathode (n)."],[38,"The four terminals of a MOSFET are:",["gate, source, drain, body","anode, cathode, gate, well","input, output, VDD, GND","base, emitter, collector, substrate"],0,"Gate, source, drain, body (bulk)."],[39,"In a bulk CMOS n-well process, nMOS transistors are built in:",["the gate oxide","the metal layer","the p-type substrate","the n-well"],2,"nMOS nằm trên substrate p; pMOS nằm trong n-well."],[40,"The body of an nMOS transistor is normally tied to:",["the gate","GND","the output","VDD"],1,"Body p nối GND để các tiếp giáp phân cực ngược."],[41,"The n-well containing pMOS transistors is normally tied to:",["VDD","GND","nothing","the input"],0,"Well n nối VDD."],[42,"An nMOS transistor turns ON when its gate is:",["floating","at 0 V","at VDD (logic 1)","at a negative voltage"],2,"nMOS dẫn khi gate = 1."],[43,"A pMOS transistor turns ON when its gate is:",["floating","at logic 1","at logic 0","connected to its drain"],2,"pMOS dẫn khi gate = 0."],[44,"In schematic symbols, the pMOS transistor is distinguished by:",["a thicker gate line","an arrow on the drain","a bubble on the gate","a dashed channel"],2,"Bong bóng ở gate biểu thị tác động mức thấp."],[45,"When a positive voltage greater than Vt is applied to the gate of an nMOS, the region under the gate is in:",["depletion","accumulation","inversion","cutoff of the body"],2,"Vg > Vt → lớp đảo (inversion) tạo kênh n."],[46,"When a negative voltage is applied to the gate of an MOS capacitor with a p-type body, holes gather under the gate. This is called:",["inversion","depletion","accumulation","saturation"],2,"Accumulation: hạt đa số (hole) tụ lại dưới cổng."],[47,"A small positive gate voltage (below Vt) on a p-type body repels holes and creates a:",["inversion layer","short circuit","accumulation layer","depletion region"],3,"Depletion: vùng nghèo hạt dẫn."],[48,"An nMOS transistor is in the cutoff region when:",["Vgs \u003c Vt","Vds > Vgs − Vt","Vgs > Vt","Vds = 0 and Vgs > Vt"],0,"Cutoff: Vgs \u003c Vt, gần như không có dòng."],[49,"An nMOS transistor is in the linear region when:",["Vgs > Vt and Vds > Vgs − Vt","Vds \u003c 0","Vgs > Vt and Vds \u003c Vgs − Vt","Vgs \u003c Vt"],2,"Linear (triode): có kênh và Vds \u003c Vdsat."],[50,"An nMOS transistor is in saturation when:",["Vgs > Vt and Vds ≥ Vgs − Vt","Vgs > Vt and Vds \u003c Vgs − Vt","Vgs = 0","Vgs \u003c Vt"],0,"Saturation: Vds ≥ Vdsat = Vgs − Vt."],[51,"In the long-channel (Shockley) model, the saturation current of an nMOS is:",["(β/2)Vgs","βVds²","β(Vgs − Vt)Vds","(β/2)(Vgs − Vt)²"],3,"Square-law: Ids = β/2 (Vgs − Vt)²."],[52,"In the linear region the long-channel current is:",["β(Vgs − Vt − Vds/2)Vds","(β/2)(Vgs − Vt)²","zero","constant"],0,"Công thức vùng tuyến tính."],[53,"In the linear region, the transistor behaves most like a:",["capacitor","current source","voltage-controlled resistor","diode"],2,"Vds nhỏ → dòng tỉ lệ Vds, giống điện trở."],[54,"In saturation, the ideal transistor behaves like a:",["current source","resistor","capacitor","short circuit"],0,"Dòng gần như không phụ thuộc Vds → nguồn dòng."],[55,"The transistor gain factor β is equal to:",["W·L·tox","µCox L/W","Cox/µ","µCox W/L"],3,"β = µ·Cox·W/L."],[56,"Gate oxide capacitance per unit area Cox is:",["εox / tox","εox · W · L","εox · tox","tox / εox"],0,"Cox = εox / tox; oxide mỏng → Cox lớn."],[57,"Making the gate oxide thinner (all else equal) will:",["have no effect","increase Cox and the transistor current","decrease the transistor current","increase the threshold voltage dramatically"],1,"tox giảm → Cox tăng → β tăng → dòng tăng."],[58,"Doubling the channel width W (all else equal) of a transistor:",["doubles its current","does not change its current","halves its current","quadruples its current"],0,"Ids ∝ W/L."],[59,"Doubling the channel length L (all else equal) of a transistor:",["does not change its current","roughly halves its current","doubles its current","quadruples its current"],1,"Ids ∝ 1/L."],[60,"The saturation voltage Vdsat of a long-channel transistor is:",["VDD/2","Vt","Vgs − Vt","Vgs + Vt"],2,"Vdsat = Vgs − Vt."],[61,"The ratio of electron mobility to hole mobility µn/µp in silicon is typically about:",["0.5","1","2–3","10"],2,"µn ≈ 2–3 µp."],[62,"Because hole mobility is lower, a pMOS transist  1","pMOS pass a strong 0","pMOS are faster"],1,"pMOS truyền mức 1 tốt."],[109,"An nMOS transistor passes:",["degraded 0 and degraded 1","strong 0 and strong 1","a strong 0 and a degraded 1","a strong 1 and a degraded 0"],2,"Mức 1 chỉ lên tới VDD − Vtn."],[110,"A pMOS transistor passes:",["no signal at all","only a strong 0","a strong 0 and a degraded 1","a strong 1 and a degraded 0"],3,"Mức 0 chỉ xuống tới |Vtp|."],[111,"Transistors in series conduct when:",["any one of them is ON","none of them is ON","all of them are ON","the first one is ON"],2,"Nối tiếp ↔ AND."],[112,"Transistors in parallel conduct when:",["none of them is ON","at least one of them is ON","exactly two are ON","all of them are ON"],1,"Song song ↔ OR."],[113,"In a static CMOS gate, the pull-up network is the ___ of the pull-down network.",["inverse polarity only","identical series structure","conduction complement (series ↔ parallel)","copy"],2,"Nối tiếp ở PDN thành song song ở PUN và ngược lại."],[114,"A 2-input static CMOS NAND gate has:",["one nMOS and one pMOS","two series nMOS and two series pMOS","two series nMOS and two parallel pMOS","two parallel nMOS and two series pMOS"],2,"NAND: nMOS nối tiếp, pMOS song song."],[115,"A 2-input static CMOS NOR gate has:",["two series pMOS only","four parallel transistors","two series nMOS and two parallel pMOS","two parallel nMOS and two series pMOS"],3,"NOR: nMOS song song, pMOS nối tiếp."],[116,"How many transistors does a 3-input static CMOS NAND gate use?",["3","4","6","8"],2,"2k = 6."],[117,"How many transistors does a static CMOS inverter use?",["1","2","4","6"],1,"1 nMOS + 1 pMOS."],[118,"A k-input static CMOS NOR gate uses:",["2k transistors","k + 1 transistors","k transistors","4k transistors"],0,"k nMOS + k pMOS."],[119,"Static CMOS gates are inherently:",["ratioed","non-inverting","tristate","inverting"],3,"Ngõ vào lên 1 chỉ có thể kéo ngõ ra xuống → luôn đảo."],[120,"To build a static CMOS AND gate you typically use:",["a NAND gate followed by an inverter","nMOS in the pull-up network","an OR gate followed by an inverter","a single transistor"],0,"AND = NAND + INV (6 transistor)."],[121,"When the pull-up network is OFF and the pull-down network is ON, the output is:",["1","0","Z","X"],1,"Chỉ PDN dẫn → 0."],[122,"When both the pull-up and pull-down networks are OFF, the output is:",["0","floating (Z, high impedance)","crowbarred (X)","1"],1,"Z – thả nổi."],[123,"When both pull-up and pull-down networks are ON, the output is:",["floating (Z)","1","crowbarred / contention (X)","0"],2,"Tranh chấp, mức không xác định, có dòng tĩnh."],[124,"In a properly designed static CMOS gate, for every input combination:",["the output is floating","exactly one network is ON","both networks are OFF","both networks are ON"],1,"Chỉ đúng một mạng dẫn."],[125,"The Boolean function of a 2-input NAND gate is:",["Y = A + B","Y = A·B","Y = (A + B)'","Y = (A·B)'"],3,"NAND = NOT AND."],[126,"The output of a 2-input NAND gate is 0 only when:",["A = 1 and B = 1","A ≠ B","A = 0 and B = 0","A = 1 or B = 1"],0,"Cả hai nMOS nối tiếp dẫn."],[127,"The output of a 2-input NOR gate is 1 only when:",["both inputs are 1","any input is 1","exactly one input is 1","both inputs are 0"],3,"Cả hai pMOS nối tiếp dẫn."],[128,"The function Y = ((A·B) + (C·D))' is implemented by a(n):",["OAI22","AOI22","AOI21","NOR4"],1,"AND-OR-INVERT 2-2."],[129,"The function Y = ((A + B)·C)' is implemented by a(n):",["AOI21","OAI21","NAND3","AOI12"],1,"OR-AND-INVERT 2-1."],[130,"The function Y = ((A·B) + C)' is implemented by a(n):",["AOI21","OAI21","NOR3","AOI22"],0,"AND-OR-INVERT 2-1."],[131,"How many transistors are needed for an AOI22 gate in static CMOS?",["4","6","8","12"],2,"4 ngõ vào × 2 = 8."],[132,"In an AOI21 gate Y = (AB + C)', the pull-down network is:",["(A parallel B) in series with C","A, B, C all in parallel","(A series B) in parallel with C","A, B, C all in series"],2,"PDN hiện thực AB + C: A nt B, song song với C."],[133,"In an OAI21 gate Y = (( lways driven to full VDD or GND through ON transistors","they use capacitors"],2,"Mức ra được kéo đầy đủ về ray."],[143,"Static CMOS gates are \"ratioless\" meaning that:",["transistor sizes do not affect correct logic levels","they have no transistors","they have no delay","the pull-up is always twice as strong"],0,"Kích thước chỉ ảnh hưởng tốc độ, không ảnh hưởng đúng/sai logic."],[144,"A tristate buffer with enable EN = 0 produces an output that is:",["high impedance (Z)","0","1","equal to the input"],0,"Tắt → Z."],[145,"A tristate inverter is built from:",["a latch","two series nMOS and two series pMOS, with one pair driven by the input and one by the enable","a NAND and a NOR only","a single transmission gate"],1,"4 transistor: 2 nMOS nt, 2 pMOS nt."],[146,"A 2:1 multiplexer can be built using:",["four series nMOS","two transmission gates controlled by S and S'","one pMOS","a D latch"],1,"Mỗi TG mở một ngõ vào."],[147,"Why are multiplexers preferred over tristate busses in modern designs?",["multiplexers need no select signals","multiplexers use no transistors","tristate busses are faster","tristate busses risk contention and floating nodes"],3,"Tristate bus dễ bị tranh chấp/thả nổi, khó kiểm chứng."],[148,"Connecting nMOS transistors in the pull-up network to build a non-inverting gate is a bad idea because:",["the output high level is degraded to VDD − Vt","it is inverting anyway","nMOS cannot conduct","it uses too many transistors"],0,"nMOS truyền mức 1 yếu."],[149,"The output of a 2-input XOR is 1 when:",["the inputs are different","both inputs are 0","both inputs are 1","both inputs are equal"],0,"XOR = 1 khi khác nhau."],[150,"In a series stack of nMOS transistors in a NAND gate, the input closest to the output should be:",["the earliest-arriving signal","the latest-arriving (critical) signal","tied to GND","tied to VDD"],1,"Tín hiệu đến muộn nhất đặt gần ngõ ra để nhanh hơn."],[151,"How many transistors does a static CMOS 2:1 inverting multiplexer (tristate-based) use?",["4","8","12","16"],1,"Hai tristate inverter × 4 = 8 (chưa tính inverter tạo S')."],[152,"What is the function of a static CMOS gate whose pull-down network has A and B in parallel?",["Y = A·B","Y = (A·B)'","Y = (A + B)'","Y = A + B"],2,"PDN song song = OR → NOR."],[153,"An inverter output drives the input of a second inverter. The combined circuit behaves as a:",["buffer","NAND","latch","XOR"],0,"Hai inverter nối tiếp = buffer (không đảo)."],[154,"Two cross-coupled inverters form:",["an XOR","an oscillator with 2 stages","a bistable element that can store one bit","a buffer"],2,"Hai inverter ghép chéo = phần tử lưỡng ổn, lưu 1 bit."],[155,"An odd number of inverters connected in a loop forms a:",["ring oscillator","buffer chain","latch","SRAM cell"],0,"Vòng lẻ inverter → dao động (ring oscillator)."],[156,"In your Lab 4 NAND, the transistor names MNA and MNB refer to:",["two pMOS transistors","two nMOS transistors driven by inputs A and B","two metal layers","two nets"],1,"M = MOSFET, N = nMOS, A/B = ngõ vào điều khiển."]]},{"t":"Latches, Flip-Flops and Sequential Timing","q":[[157,"Combinational logic differs from sequential logic because its output depends on:",["only the previous output","current inputs and past state","only the clock","only the current inputs"],3,"Tổ hợp: chỉ phụ thuộc ngõ vào hiện tại."],[158,"A D latch with CLK = 1 transparent is:",["level-sensitive","asynchronous","combinational","edge-triggered"],0,"Latch nhạy mức."],[159,"When a positive-level-sensitive D latch has CLK = 1, the output Q:",["is floating","follows D","holds its old value","is always 0"],1,"Trong suốt: Q theo D."],[160,"When a positive-level-sensitive D latch has CLK = 0, the latch is:",["oscillating","transparent","reset to 0","opaque and holds its value"],3,"Đóng (opaque), giữ giá trị."],[161,"A positive-edge-triggered D flip-flop copies D to Q:",["on the falling edge of CLK","on the rising edge of CLK","whenever D changes","whenever CLK is high"],1,"Kích cạnh lên."],[162,"A master–slave positive-edge flip-flop is built from:",["two positive-level latches","a positive master and a negative slave","a single latch and an inverter","a negative-level-sensitive master latch followed by a positive-level-sensitive slave latch"],3,"Master trong suốt khi CLK = 0, slave trong suốt khi CLK = 1 → chép ở cạnh lên."],[163,"In a master–slave flip-flop, while CLK = 0:",["both are opaque","the master is transparent and the slave is opaque","the slave is transparent and the master is opaque","both are transparent"],1,"Master nhận D, slave giữ Q cũ."],[164,"A basic dynamic latch stores its value on:",["a resistor","a fuse","a capacitance node that can leak away","a feedback loop"],2,"Latch động giữ điện tích trên tụ → rò mất theo thời gian."],[165,"Static latches differ from dynamic latches by using:",["only nMOS","feedback (cross-coupled inverters) to hold the value indefinitely","larger capacitors","no clock"],1,"Vòng hồi tiếp giữ trạng thái."],[166,"A flip-flop consisting of many bits sharing a clock is often called a:",["decoder","multiplexer","latch array only","register"],3,"Register (thanh ghi)."],[167,"In your Lab 5 DFF, what circuit element is used to pass or block data in each latch?",["transmission gates","fuses","diodes","pseudo-nMOS gates"],0,"DFF master–slave dùng TG + inverter."],[168,"The setup time tsetup is the time that data must be stable:",["during the whole clock period","after the clock edge","before the clock edge","after the output changes"],2,"Setup: ổn định trước cạnh clock."],[169,"The hold time thold is the time that data must be stable:",["before the clock edge","before reset","between two clock edges","after the clock edge"],3,"Hold: giữ ổn định sau cạnh clock."],[170,"The clock-to-Q propagation delay tpcq is:",["the maximum delay from the clock edge to a stable output","the setup time","the clock period","the minimum delay from data to clock"],0,"tpcq: trễ lớn nhất từ clock tới Q."],[171,"The clock-to-Q contamination delay tccq is:",["the maximum delay from clock to Q","the minimum delay from clock edge until Q starts to change","always zero","the hold time"],1,"tccq: trễ nhỏ nhất."],[172,"For a flip-flop-based system without skew, the max-delay (setup) constraint is:",["Tc ≥ thold","Tc ≥ tpcq + tpd + tsetup","tcd ≥ thold − tccq","Tc ≤ tpcq + tpd"],1,"Chu kỳ phải đủ cho tpcq + logic + setup."],[173,"For a flip-flop-based system without skew, the min-delay (hold) constraint is:",["tpd ≤ tsetup","tcd ≥ thold − tccq","Tc ≥ tpcq + tpd + tsetup","thold ≥ Tc"],1,"Đường ngắn nhất không được làm hỏng dữ liệu vừa chốt."],[174,"A setup time violation can be fixed by:",["reducing hold time","adding more flip-flops only","lowering the clock frequency (increasing Tc)","increasing clock skew"],2,"Setup = lỗi max-delay → chậm clock là khắc phục được."],[175,"A hold time violation:",["can be fixed by slowing down the clock","disappears at high temperature","cannot be fixed by changing the clock frequency; the logic must be redesigned (e.g. add delay)","only occurs in latches"],2,"Hold không phụ thuộc Tc."],[176,"Hold time failures are also called:",["race conditions (min-delay failures)","soft errors","electromigration failures","max-delay failures"],0,"Race: dữ liệu mới chạy xuyên qua quá nhanh."],[177,"The sequencing overhead of a flip-flop system (ignoring skew) is:",["tpd + tcd","Tc/2","tpcq + tsetup","thold + tccq"],2,"Phần thời gian chu kỳ không dùng cho logic."],[178,"Clock skew is:",["the duty cycle","the rise time of the clock","the difference in arrival times of the clock at different sequencing elements","the clock period"],2,"Chênh lệch thời điểm clock đến các FF."],[179,"For flip-flop-based systems, clock skew:",["has no effect","always improves timing","affects only latches","directly reduces the time available for logic and makes hold harder to satisfy"],3,"Skew cộng vào ràng buộc setup và hold."],[180,"Two-phase transparent-latch systems are attractive because they:",["eliminate setup time","use fewer latches than flip-flops","are tolerant of clock skew and allow time borrowing","need no clock"],2,"Latch trong suốt cho phép mượn thời gian, chịu skew."],[181,"Time borrowing refers to:",["logic in one half-cycle using time from the next half-cycle through a transparent latch","sharing clock buffers","using a slower clock","reading from SRAM"],0,"Chỉ có với latch trong suốt."],[182,"Flip-flops cannot borrow time because:",["they have zero delay","they create a hard edge at each clock","they have no clock input","they are always transparent"],1,"Cạnh clock là \"hard edge\"."],[183,"Two-phase nonoverlapping clocks are used with latches to:",["avoid needing inverters","double the frequency","save power only","avoid hold-time/race problems"],3,"Hai pha không chồng lấp tránh race."],[184,"Pulsed latches offer the lowest sequencing overhead but are prone to:",["min-delay (hold) problems","latchup","setup problems only","electromigration"],0,"Xung ngắn nhưng dễ lỗi hold."],[185,"Metastability occurs when:",["VDD is too high","the flip-flop is reset","the data input changes too close to the sampling clock edge","the clock is gated"],2,"Dữ liệu vi phạm setup/hold → ngõ ra ở mức trung gian."],[186,"A synchronizer (two flip-flops in series) is used to:",["sample asynchronous inputs and reduce the probability of metastability failure","increase clock frequency","eliminate clock skew","store two bits"],0,"Cho thêm thời gian để thoát trạng thái metastable."],[187,"The probability of synchronizer failure decreases:",["only with larger flip-flops","linearly with VDD","never","exponentially with the resolution time allowed"],3,"MTBF tăng theo hàm mũ với thời gian chờ."],[188,"A flip-flop with an additional multiplexer at its input to select scan data is called a:",["synchronizer","scan flip-flop","pulsed latch","SR latch"],1,"Dùng cho scan chain trong DFT."],[189,"Which element has a propagation delay from D to Q while it is transparent (tpdq)?",["a latch","a multiplexer","a register file","an edge-triggered flip-flop only"],0,"Latch trong suốt có đường D → Q."],[190,"A reset input that forces Q = 0 regardless of the clock is:",["scan enable","asynchronous reset","clock enable","synchronous reset"],1,"Không phụ thuộc clock → asynchronous."],[191,"A reset that only takes effect at the active clock edge is:",["synchronous reset","an enable","power-on reset only","asynchronous reset"],0,"Synchronous reset."],[192,"Clock gating in a sequential circuit mainly aims to:",["fix hold violations","increase setup time","reduce dynamic power in idle registers","reduce leakage only"],2,"Không có clock → không chuyển mạch."],[193,"In your Lab 5 DFF measurement, the setup time is measured by:",["changing VDD","moving the data edge closer to the clock edge until the output fails or the delay increases","measuring supply current","measuring the rise time of Q"],1,"Quét thời điểm D so với cạnh clock."],[194,"A system using positive-edge flip-flops has tpcq = 50 ps, tsetup = 30 ps and a logic delay tpd = 420 ps. The minimum clock period is:",["420 ps","470 ps","500 ps","550 ps"],2,"50 + 420 + 30 = 500 ps."],[195,"A system has tccq = 30 ps and thold = 60 ps. The minimum contamination delay of the logic must be at least:",["0 ps","30 ps","60 ps","90 ps"],1,"tcd ≥ 60 − 30 = 30 ps."],[196,"A flip-flop system has Tc = 1 ns, tpcq = 80 ps, tsetup = 40 ps, and skew 30 ps. The maximum logic delay is:",["850 ps","880 ps","920 ps","1000 ps"],0,"1000 − 80 − 40 − 30 = 850 ps."]]},{"t":"DC Transfer Characteristics and Noise Margins","q":[[197,"The voltage transfer characteristic (VTC) of an inverter plots:",["power versus frequency","Vout versus Vin","current versus time","Vout versus time"],1,"VTC: Vout theo Vin."],[198,"The switching threshold (Vinv or VM) of an inverter is the point where:",["the current is zero","Vout = 0","Vin = VDD","Vin = Vout"],3,"Giao của VTC với đường Vin = Vout."],[199,"For a CMOS inverter with βp = βn and Vtn = |Vtp|, the switching threshold is:",["VDD","Vtn","VDD − Vtn","VDD/2"],3,"Đối xứng → VDD/2."],[200,"If the pMOS of an inverter is made much stronger than the nMOS, the switching threshold:",["becomes negative","moves lower","stays at VDD/2","moves higher (closer to VDD)"],3,"pMOS mạnh kéo VM lên."],[201,"An inverter with a stronger pMOS than normal is called:",["unskewed","pseudo-nMOS","LO-skew","HI-skew"],3,"HI-skew: nhạy với cạnh lên của ngõ ra."],[202,"An inverter with a stronger nMOS than normal is called:",["LO-skew","balanced","tristate","HI-skew"],0,"LO-skew: VM thấp."],[203,"The beta ratio βp/βn affects mainly:",["the switching threshold (VM)","the supply voltage","the logic function","the number of transistors"],0,"Tỉ lệ β dịch VM."],[204,"Near Vin = VM in a CMOS inverter, both transistors are:",["in linear region","in saturation, giving high gain","OFF","in cutoff"],1,"Vùng C: cả hai bão hòa, độ lợi lớn nhất."],[205,"When Vin = 0 in a CMOS inverter, the nMOS is ___ and the pMOS is ___.",["OFF, OFF","ON, ON","ON, OFF","OFF, ON (linear)"],3,"Vin = 0 → nMOS tắt, pMOS dẫn → Vout = VDD."],[206,"When Vin = VDD in a CMOS inverter:",["the nMOS is ON (linear), the pMOS is OFF, output is 0","both transistors are ON","the pMOS is ON and output is VDD","the output floats"],0,"Ngõ ra = 0."],[207,"The unity-gain points on the VTC, used to define VIL and VIH, are where the slope dVout/dVin is:",["0","+1","−1","−∞"],2,"Điểm độ dốc bằng −1."],[208,"The low noise margin NML is defined as:",["VOH − VOL","VOH − VIH","VIH − VIL","VIL − VOL"],3,"NML = VIL − VOL."],[209,"The high noise margin NMH is defined as:",["VDD − VIL","VOH − VIH","VIH − VOL","VIL − VOL"],1,"NMH = VOH − VIH."],[210,"The region between VIL and VIH is called the:",["saturation region","safe zone","accumulation region","forbidden zone (undefined region)"],3,"Mức không xác định."],[211,"An ideal inverter would have:",["NML = NMH = 0","a linear VTC with slope −1","VOL = VDD","NML = NMH = VDD/2 and infinite gain at VDD/2"],3,"Lý tưởng: chuyển mạch đột ngột ở VDD/2."],[212,"In a static CMOS inverter, VOL and VOH are ideally:",["0 and VDD/2","VDD/2 and VDD","0 and VDD","Vt and VDD − Vt"],2,"Ngõ ra đầy đủ mức nhờ restoring logic."],[213,"A pseudo-nMOS inverter has a VOL that is:",["exactly 0","negative","equal to VDD","greater than 0 because of contention with the always-ON pMOS"],3,"Mạch ratioed: VOL > 0."],[214,"Noise margins should be compared as a fraction of VDD because:",["margins are always zero","VDD is always 1 V","noise does not depend on VDD","an absolute margin of 0.4 V is large at 1 V but small at 5 V"],3,"So sánh theo tỉ lệ VDD."],[215,"During the transition of a CMOS inverter, a short-circuit current flows because:",["the load capacitor leaks","the gate oxide breaks down","both transistors are partially ON at the same time","the body diode conducts"],2,"Khi Vtn \u003c Vin \u003c VDD − |Vtp|."],[216,"In your Lab 3 inverter, the measured switching threshold was 0.884 V with VDD = 1.8 V. This means the inverter is:",["slightly LO-skewed (pMOS slightly weaker than ideal)","exactly balanced","strongly HI-skewed","not functional"],0,"VM \u003c 0.9 V một chút → pMOS hơi yếu."],[217,"A higher inverter gain in the transition region generally leads to:",["no change","smaller noise margins","higher static power","larger noise margins"],3,"Chuyển mạch càng dốc thì NM càng lớn."],[218,"For an inverter with VOL = 0, VOH = 1.8 V, VIL = 0.75 V, VIH = 1.0 V, the noise margins NML and NMH are:",["0.75 V and 0.8 V","1.0 V and 0.75 V","0.25 V and 0.25 V","1.8 V and 0 V"],0,"NML = 0.75 − 0; NMH = 1.8 − 1.0."],[219,"A signal from a gate with VOH = 1.6 V drives a gate with VIH = 1.2 V. The high noise margin is:",["0.2 V","0.4 V","1.2 V","1.6 V"],1,"1.6 − 1.2 = 0.4 V."],[220,"The DC transfer curve of a ratioed (pseudo-nMOS) inverter differs from static CMOS because:",["it has no output","it has infinite noise margin","its output low level depends on the pull-up/pull-down strength ratio","it is non-inverting"],2,"Mức thấp phụ thuộc tỉ lệ kích thước."],[221,"The \"crowbar\" or contention current is present in steady state in which gate?",["CMOS inverter with input at 0","pseudo-nMOS NOR when the output is low","transmission gate","static CMOS NAND"],1,"pMOS luôn bật tranh chấp với nMOS khi ngõ ra thấp."],[222,"Beyond the switching threshold, a small increase in Vin causes Vout to:",["decrease greatly (high gain)","remain at VDD","oscillate","increase greatly"],0,"Độ lợi âm lớn."],[223,"A Schmitt trigger has a VTC with:",["hysteresis (different thresholds for rising and falling inputs)","a single threshold","a positive slope","no output"],0,"Trễ (hysteresis) giúp chống nhiễu."],[224,"The VTC of an inverter is divided into regions A–E. In region A (Vin \u003c Vtn):",["both OFF","nMOS linear, pMOS OFF, Vout = 0","both saturated","nMOS OFF, pMOS linear, Vout = VDD"],3,"Vùng A: ngõ ra cao."],[225,"In region E of the inverter VTC (Vin > VDD − |Vtp|):",["nMOS OFF, pMOS linear","nMOS linear, pMOS OFF, Vout = 0","both saturated","output floats"],1,"Vùng E: ngõ ra thấp."],[226,"Increasing the pMOS width in your Lab 3 inverter would:",["lower VM","raise the switching threshold VM","make the inverter non-inverting","not affect VM"],1,"pMOS mạnh hơn → VM tăng."]]},{"t":"CMOS Fabrication","q":[[227,"Single-crystal silicon ingots for wafers are typically grown using the:",["sputtering method","Czochralski method","damascene method","lift-off method"],1,"Kéo phôi đơn tinh thể Czochralski."],[228,"The step in which a pattern on a mask is transferred to a photoresist-coated wafer using light is called:",["ion implantation","photolithography","oxidation","chemical-mechanical polishing"],1,"Quang khắc."],[229,"A photomask is typically made of:",["copper on plastic","polysilicon on oxide","aluminum on silicon","chromium patterns on quartz glass"],3,"Mask crôm trên thạch anh."],[230,"With positive photoresist, the regions exposed to light:",["become soluble and are removed during development","become insoluble and remain","turn into oxide","become metal"],0,"Positive resist: vùng chiếu sáng tan đi."],[231,"With negative photoresist, the regions exposed to light:",["become insoluble (hardened) and remain","are oxidized","are doped","become soluble"],0,"Negative resist: vùng chiếu sáng cứng lại."],[232,"Silicon dioxide is grown on a wafer by:",["heating the wafer in an oxidizing atmosphere (about 900–1200 °C)","sputtering copper","spinning photoresist","ion implantation of boron"],0,"Oxy hóa nhiệt."],[233,"Hydrofluoric acid (HF) is used in CMOS processing to:",["deposit polysilicon","remove metal only","grow oxide","etch silicon dioxide"],3,"HF ăn mòn SiO2 nhưng không ăn Si."],[234,"The \"piranha etch\" (H2SO4 + H2O2) is used to:",["strip photoresist","grow oxide","etch polysilicon","deposit aluminum"],0,"Bóc lớp photoresist."],[235,"Dopants are introduced into silicon by:",["photolithography only","CMP","diffusion or ion implantation","sputtering or evaporation"],2,"Khuếch tán hoặc cấy ion."],[236,"Ion implantation is preferred in modern processes because:",["it grows oxide","it is done at 2000 °C","it gives precise control of dose and depth","it needs no masks"],2,"Kiểm soát chính xác liều và độ sâu."],[237,"Polysilicon for gates is deposited by:",["electroplating","chemical vapor deposition (CVD) from silane gas","oxidation","ion implantation"],1,"CVD dùng khí silane SiH4."],[238,"In a self-aligned process, the source and drain are formed:",["using a separate precise mask","in the metal layer","before the gate","after the gate, using the gate as a mask so they align to it automatically"],3,"Gate che kênh khi pha tạp S/D."],[239,"Aluminum interconnect was traditionally deposited by:",["oxidation","sputtering","ion implantation","CVD from silane"],1,"Phún xạ (sputtering) rồi khắc plasma."],[240,"The first mask in the simple n-well CMOS process defines the:",["contacts","metal","n-well","p+ diffusion"],2,"Bước đầu là tạo n-well."],[241,"The six basic masks of a simple n-well CMOS process are n-well, polysilicon, n+ diffusion, p+ diffusion, contact and:",["gate oxide","via2","p-well","metal"],3,"Mask cuối là metal."],[242,"The thick oxide that isolates neighboring transistors is called:",["tunnel oxide","gate oxide","buried oxide","field oxide"],3,"Field oxide cách ly các transistor."],[243,"Shallow trench isolation (STI):",["replaces the n-well","fills etched trenches with oxide to isolate transistors","is the gate dielectric","is a type of metal layer"],1,"STI: rãnh nông lấp oxide."],[244,"LOCOS (local oxidation of silicon) isolation suffers from:",["no drawbacks","electromigration","excessive gate leakage","the \"bird's beak\" encroachment into the active region"],3,"Bird's beak làm hẹp vùng active."],[245,"The processing steps that build the transistors are called:",["back-end-of-line (BEOL)","packaging","testing","front-end-of-line (FEOL)"],3,"FEOL."],[246,"The processing steps that build the metal interconnect are called:",["implantation","CMP only","FEOL","BEOL"],3,"BEOL."],[247,"Chemical-mechanical polishing (CMP) is used to:",["grow the ingot","dope the silicon","expose photoresist","planarize the wafer surface between layers"],3,"Làm phẳng bề mặt."],[248,"Modern processes use copper interconnect rather than aluminum mainly because copper:",["is easier to etch","is transparent","is an insulator","has lower resistivity and better electromigration resistance"],3,"Cu điện trở thấp, bền EM tốt hơn."],[249,"Copper wires are usually formed using the:",["damascene process (etch trenches in dielectric, fill with copper, polish)","Czochralski process","self-aligned gate process","LOCOS process"],0,"Damascene vì Cu khó khắc trực tiếp."],[250,"A silicide (salicide) layer on poly and diffusion is used to:",["insulate them","reduce their sheet resistance","increase the threshold voltage","create the well"],1,"Silicide giảm điện trở."],[251,"A \"contact\" connects:",["the package to the board","two wafers","metal1 to polysilicon or diffusion","metal1 to metal2"],2,"Contact: metal1 ↔ poly/diff; via: metal ↔ metal."],[252,"A \"via\" connects:",["poly to diffusion","metal to diffusion","adjacent metal layers","the well to substrate"],2,"Via nối các lớp kim loại với nhau."],[253,"A substrate tap is a p+ diffusion connected to:",["GND","VDD","the gate","the output"],0,"Nối body p về GND."],[254,"A well tap is an n+ diffusion in the n-well connected to:",["the input","the clock","GND","VDD"],3,"Nối n-well về VDD."],[255,"Taps (body contacts) are needed to:",["increase transistor speed only","keep junctions reverse-biased and prevent latchup","connect metal layers","form transistors"],1,"Giữ điện thế body ổn định."],[256,"A twin-well process provides:",["separate wells for nMOS and pMOS so each can be optimized","two gate oxides only","two metal layers","two wafers bonded together"],0,"Có cả n-well và p-well."],[257,"Silicon-on-insulator (SOI) transistors are built:",["without gates","on a thin silicon layer above a buried oxide","on glass only","inside a thick metal"],1,"Lớp Si mỏng trên buried oxide."],[258,"An advantage of SOI over bulk CMOS is:",["lower parasitic junction capacitance and immunity to latchup","lower cost","simpler wafer manufacturing","no need for gates"],0,"Tụ ký sinh nhỏ, không latchup."],[259,"The final data sent to the foundry to make masks is usually in the format:",["GDSII","Verilog","SPICE","PDF"],0,"GDSII (hoặc OASIS/CIF)."],[260,"CIF (Caltech Intermediate Form) is:",["a mask layout format used mainly in academia","a timing format","a Verilog dialect","a test standard"],0,"CIF: định dạng layout học thuật."],[261,"Mask set cost for an advanced node (e.g. 65 nm) is approximately:",["millions of dollars","hundreds of dollars","billions of dollars","thousands of dollars"],0,"~ vài triệu USD."],[262,"Packaging a chip in a flip-chip package means:",["there are no I/O pins","the chip is placed upside down in a DIP","solder bumps on the die face unting the number of wiring tracks in each direction"],3,"Nhân số track với pitch."],[283,"Using a common diffusion strip for series transistors in a NAND gate:",["shorts the output","reduces area and diffusion capacitance","is illegal","increases area"],1,"Chia chung khuếch tán."],[284,"An Euler path through the transistor graph is used in layout to:",["compute logical effort","order transistors so a single unbroken diffusion strip can be used","find the critical path","count masks"],1,"Đường Euler giúp không phải ngắt diffusion."],[285,"Latchup in CMOS is caused by:",["crosstalk","a parasitic silicon-controlled rectifier (SCR) formed by npn and pnp bipolar transistors","gate oxide tunneling","electromigration in metal"],1,"SCR ký sinh tạo đường ngắn mạch VDD–GND."],[286,"Once latchup is triggered:",["only the clock stops","the chip runs faster","it stops by itself immediately","a low-resistance path between VDD and GND persists, possibly destroying the chip"],3,"Dòng lớn kéo dài tới khi tắt nguồn."],[287,"Which layout practice best prevents latchup?",["removing guard rings","placing substrate and well taps close to transistors","increasing well resistance","using long polysilicon wires"],1,"Tap gần → điện trở well/substrate nhỏ."],[288,"Guard rings around I/O transistors are used to:",["collect injected carriers and prevent latchup","increase capacitance","route clock signals","reduce the logic effort"],0,"Guard ring chống latchup."],[289,"Which technology is inherently immune to latchup?",["bulk CMOS","silicon-on-insulator (SOI)","bipolar","nMOS only"],1,"SOI không có SCR ký sinh."],[290,"A Design Rule Check (DRC) verifies that:",["the layout meets geometric manufacturing rules","the RTL is correct","the circuit meets timing","the layout matches the schematic"],0,"DRC = kiểm luật hình học."],[291,"Layout Versus Schematic (LVS) verifies that:",["the package is correct","the chip is fast enough","the extracted layout netlist matches the schematic netlist","the layo hỏ nhất."],[302,"In Weste & Harris, rise time tr is defined as the time for a waveform to go from:",["10% to 90%","20% to 80%","0% to 100%","50% to 100%"],1,"Sách này dùng 20%–80%."],[303,"The fall time tf in Weste & Harris is defined from:",["80% to 20%","90% to 10%","100% to 0%","50% to 0%"],0,"Fall: 80% → 20%."],[304,"The arrival time is:",["the time at which a signal is required","the clock period","the latest time at which a signal can change","the hold time"],2,"Thời điểm tín hiệu đến."],[305,"Slack is defined as:",["required time − arrival time","clock period × 2","arrival time − required time","tpd − tcd"],0,"Slack = required − arrival."],[306,"A path with negative slack:",["meets timing with margin","has no delay","fails timing","has a hold violation only"],2,"Slack âm → không đạt."],[307,"The critical path of a circuit is:",["the path with the longest delay, which limits the clock frequency","the path with the most transistors","the clock tree","the shortest path"],0,"Đường dài nhất."],[308,"In the RC delay model, a unit nMOS transistor has effective resistance R. A unit pMOS (same size) has resistance about:",["R/2","R","2R (2–3R)","10R"],2,"Độ linh động thấp → điện trở gấp 2–3."],[309,"A transistor k times wider than unit has effective resistance:",["kR","R/k","R","R/k²"],1,"Rộng hơn → điện trở nhỏ hơn."],[310,"A transistor k times wider than unit has gate capacitance:",["kC","C/k","C","k²C"],0,"Tụ tỉ lệ với W."],[311,"The delay of an RC circuit (50% point) is approximately:",["0.69 RC","RC²","2RC","R/C"],0,"ln2 · RC ≈ 0.69 RC."],[312,"The Elmore delay of an RC tree is:",["the maximum RC of any branch","the minimum RC","the sum over each node of its capacitance times the resistance shared with the path from the source","the product of total R and total C"],2,"td = Σ R_is · C_i."],[313,"For an RC ladder driver R1 → node1 (C1) → R2 → node2 (C2), the Elmore delay to node2 is:",["(R1 + R2)(C1 + C2)","R1C1 + R2C2","R2C1 + R1C2","R1C1 + (R1 + R2)C2"],3,"Mỗi tụ  higher than NAND logical effort?",["NOR has series nMOS transistors","NOR has more transistors","NOR has no pull-up","NOR has series pMOS transistors, which must be made wide"],3,"pMOS nối tiếp phải rất rộng → tụ ngõ vào lớn."],[330,"The delay of a fanout-of-4 (FO4) inverter in units of τ is:",["1","4","5","8"],2,"d = 1·4 + 1 = 5τ."],[331,"The FO4 inverter delay is commonly used because:",["it is the fastest possible gate","it provides a process-independent way to express delay","it is only used in SRAM","it measures leakage"],1,"Đơn vị delay dùng chung giữa các công nghệ."],[332,"A 2-input NAND gate drives a load 3 times its input capacitance. Its delay (in τ) is:",["4","5","6","7"],2,"d = (4/3)(3) + 2 = 6."],[333,"An inverter drives a load 6 times its input capacitance. Its delay in τ is:",["6","7","8","12"],1,"d = 1·6 + 1 = 7."],[334,"A 2-input NOR gate with electrical effort h = 3 has a delay in τ of:",["5","6","7","8"],2,"(5/3)(3) + 2 = 7."],[335,"For a multistage path, the path effort F is:",["G · B · H","G / H","G + B + H","the sum of stage delays"],0,"F = G·B·H."],[336,"The path logical effort G is:",["the largest logical effort","always 1","the sum of the logical efforts","the product of the logical efforts of the stages"],3,"G = Π g_i."],[337,"Branching effort b accounts for:",["the wire length only","the parasitic delay","the number of logic levels","fanout to other paths at a node (Ctotal/Conpath)"],3,"b = (Con-path + Coff-path)/Con-path."],[338,"The minimum delay of an N-stage path is achieved when each stage has effort:",["equal to F^(1/N)","equal to 1","as large as possible","equal to F"],0,"Chia đều effort cho các tầng."],[339,"The best stage effort (ignoring parasitics effects detail) is approximately:",["1","4","16","64"],1,"ρ ≈ 4 (3.6 lý thuyết)."],[340,"To drive a very large load (e.g. an output pad) from a small gate, you should:",["use a NOR3","add a series resistor","use one very small inverter","use a chain of increasingly larger inverters ( ,["increasing frequency","increasing capacitance","reducing VDD","increasing VDD"],2,"Phụ thuộc bình phương."],[354,"Short-circuit power in a well-designed CMOS circuit is typically:",["dominant at all times","larger than dynamic power","less than about 10% of dynamic power","zero always"],2,"\u003c 10%."],[355,"Short-circuit current flows when:",["both the pull-up and pull-down networks are partially ON during a transition","the gate is idle","the chip is powered off","the output is floating"],0,"Trong lúc chuyển mạch."],[356,"Static power in CMOS is mainly due to:",["crosstalk","leakage currents (subthreshold, gate, junction) and contention","switching capacitances","the clock only"],1,"Công suất tĩnh = rò + tranh chấp."],[357,"Clock gating reduces power by:",["cutting off VDD to idle blocks","stopping the clock to idle blocks, lowering the activity factor","increasing capacitance","reducing Vt"],1,"Giảm α."],[358,"Power gating reduces power by:",["turning off the supply of idle blocks with sleep transistors, reducing leakage","increasing VDD","gating the clock","reducing the activity factor only"],0,"Cắt nguồn → giảm rò."],[359,"Using high-Vt transistors on noncritical paths and low-Vt on critical paths is called:",["clock gating","DVFS","multiple-threshold (multi-Vt) design","power gating"],2,"Multi-Vt."],[360,"Dynamic voltage and frequency scaling (DVFS) reduces power by:",["lowering VDD and f when full performance is not needed","removing leakage","adding more cores","increasing VDD"],0,"Giảm V và f khi tải nhẹ."],[361,"Parallelism can save energy because:",["it doubles the clock frequency","it reduces the number of transistors","two units running at half speed can use a lower VDD, reducing CV²","it removes capacitance"],2,"Làm song song rồi hạ VDD."],[362,"The stack effect refers to:",["reduced leakage when two or more series transistors are OFF","stacked dies in a package","increased delay of stacked gates","metal stacking"],0,"Rò giảm ~10 lần."],[363,"Glitc /* ---------- storage (per-viewer convenience) ---------- */
const KEY = "vlsi500.v1";
let S = { p: {}, ui: {} };          // p[n] = {b: box 1..3, c: correct, w: wrong, t: last time}
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.p) S = Object.assign(S, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* Leitner: new+correct -> 3 (known); wrong -> 1; review correct -> b+1. Box 3 = mastered. */
function record(n, correct) {
  const r = S.p[n] || { b: 0, c: 0, w: 0, t: 0 };
  if (correct) { r.c++; r.b = r.b === 0 ? 3 : Math.min(3, r.b + 1); }
  else { r.w++; r.b = 1; }
  r.t = Date.now();
  S.p[n] = r; save(); renderMeter();
}
const status = n => { const r = S.p[n]; return !r ? "new" : r.b >= 3 ? "known" : "learning"; };
const reviewPool = () => Q.filter(q => status(q.n) === "learning")
  .sort((a, b) => (S.p[a.n].b - S.p[b.n].b) || (S.p[a.n].t - S.p[b.n].t));

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const chip = t => `<span class="chip" style="--chip:var(${CHIP[t]})">Topic ${t + 1} · ${esc(RAW[t].t)}</span>`;
const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

function renderMeter() {
  let k = 0, l = 0;
  Q.forEach(q => { const s = status(q.n); if (s === "known") k++; else if (s === "learning") l++; });
  const nw = Q.length - k - l;
  $("#meterBar").innerHTML = `<span style="width:${k / 5}%;background:var(--ok)"></span><span style="width:${l / 5}%;background:var(--bad)"></span>`;
  $("#meterLegend").innerHTML = `<span><i class="dot" style="background:var(--ok)"></i>Đã thuộc ${k}</span><span><i class="dot" style="background:var(--bad)"></i>Cần ôn ${l}</span><span><i class="dot" style="background:var(--sunk);outline:1px solid var(--line)"></i>Chưa làm ${nw}</span>`;
  $("#reviewCount").textContent = l ? l : "";
}

/* ---------- question card (shared by practice + review) ---------- */
function questionCard(q, pos, total, picked, onPick, onNext, nextLabel) {
  const answered = picked !== null && picked !== undefined;
  const opts = q.opts.map((o, i) => {
    let cls = "opt";
    if (answered) { if (i === q.ans) cls += " right"; else if (i === picked) cls += " wrong"; }
    return `<button class="${cls}" data-i="${i}" ${answered ? "disabled" : ""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  const ok = picked === q.ans;
  const fb = answered ? `<div class="feedback ${ok ? "ok" : "bad"}"><b class="${ok ? "ok-t" : "bad-t"}">${ok ? "Đúng" : "Sai · đáp án " + L[q.ans]}</b>${esc(q.opts[q.ans])} — ${esc(q.exp)}</div>` : "";
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="progress-line"><span style="width:${(pos / total) * 100}%"></span></div>
    <div class="qmeta">${chip(q.t)}<span class="num">Câu ${q.n} · ${pos}/${total}</span></div>
    <p class="qtext">${esc(q.text)}</p>
    <div class="opts">${opts}</div>
    ${fb}
    <div class="nav"><span class="hint"><span class="kbd">1</span>–<span class="kbd">4</span> hoặc <span class="kbd">A</span>–<span class="kbd">D</span> để chọn · <span class="kbd">Enter</span> câu tiếp</span>
      <button class="btn primary" id="nextBtn" ${answered ? "" : "disabled"}>${nextLabel}</button></div>`;
  el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => onPick(+b.dataset.i)));
  el.querySelector("#nextBtn").addEventListener("click", onNext);
  keyHandler = e => {
    if (e.target.tagName === "SELECT") return;
    const k = e.key.toUpperCase();
    const i = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "ABCD".indexOf(k);
    if (!answered && i >= 0 && k.length === 1) { e.preventDefault(); onPick(i); }
    else if (answered && (e.key === "Enter" || e.key === "ArrowRight")) { e.preventDefault(); onNext(); }
  };
  return el;
}
let keyHandler = null;
document.addEventListener("keydown", e => keyHandler && keyHandler(e));

/* ---------- PRACTICE ---------- */
const P = { topic: S.ui.topic ?? 0, filter: S.ui.filter ?? "all", order: S.ui.order ?? "seq", queue: [], i: 0, picked: null };
function buildPractice() {
  let pool = P.topic === -1 ? Q : Q.filter(q => q.t === P.topic);
  if (P.filter === "new") pool = pool.filter(q => status(q.n) === "new");
  if (P.filter === "notknown") pool = pool.filter(q => status(q.n) !== "known");
  P.queue = P.order === "rand" ? shuffle(pool) : pool.slice();
  P.i = 0; P.picked = null;
  S.ui.topic = P.topic; S.ui.filter = P.filter; S.ui.order = P.order; save();
}
function practiceView() {
  const v = $("#view"); v.innerHTML = "";
  const ctl = document.createElement("div"); ctl.className = "controls";
  ctl.innerHTML = `
    <label for="pTopic">Chủ đề <select id="pTopic"><option value="-1">Tất cả (500 câu)</option>${RAW.map((t, i) => `<option value="${i}">${i + 1}. ${esc(t.t)} (${t.q.length})</option>`).join("")}</select></label>
    <label for="pFilter">Câu <select id="pFilter"><option value="all">Tất cả</option><option value="new">Chưa làm</option><option value="notknown">Chưa thuộc</option></select></label>
    <label for="pOrder">Thứ tự <select id="pOrder"><option value="seq">Theo số câu</option><option value="rand">Ngẫu nhiên</option></select></label>`;
  v.appendChild(ctl);
  ctl.querySelector("#pTopic").value = P.topic; ctl.querySelector("#pFilter").value = P.filter; ctl.querySelector("#pOrder").value = P.order;
  ctl.querySelector("#pTopic").onchange = e => { P.topic = +e.target.value; buildPractice(); practiceView(); };
  ctl.querySelector("#pFilter").onchange = e => { P.filter = e.target.value; buildPractice(); practiceView(); };
  ctl.querySelector("#pOrder").onchange = e => { P.order = e.target.value; buildPractice(); practiceView(); };
  if (!P.queue.length || P.i >= P.queue.length) {
    const done = P.queue.length && P.i >= P.queue.length;
    const e = document.createElement("div"); e.className = "card empty";
    e.innerHTML = done
      ? `<strong>Xong phần này</strong><span>Các câu làm sai đã được đưa vào tab “Ôn câu sai”.</span><button class="btn primary" id="again">Làm lại từ đầu</button>`
      : `<strong>Không còn câu nào khớp bộ lọc</strong><span>Đổi “Câu” sang “Tất cả” hoặc chọn chủ đề khác.</span>`;
    v.appendChild(e); keyHandler = null;
    const a = e.querySelector("#again"); if (a) a.onclick = () => { buildPractice(); practiceView(); };
    return;
  }
  const q = P.queue[P.i];
  v.appendChild(questionCard(q, P.i + 1, P.queue.length, P.picked,
    i => { if (P.picked !== null) return; P.picked = i; record(q.n, i === q.ans); practiceView(); },
    () => { P.i++; P.picked = null; practiceView(); window.scrollTo({ top: 0 }); },
    P.i + 1 < P.queue.length ? "Câu tiếp →" : "Kết thúc"));
}

/* ---------- REVIEW (spaced) ---------- */
const R = { q: null, picked: null, done: 0 };
function reviewView() {
  const v = $("#view"); v.innerHTML = "";
  const pool = reviewPool();
  const info = document.createElement("p"); info.className = "note";
  info.innerHTML = `Câu sai vào hộp 1. Đúng 2 lần liên tiếp thì thành “Đã thuộc”. Câu ở hộp thấp và lâu chưa gặp được hỏi trước. Còn <b>${pool.length}</b> câu.`;
  v.appendChild(info);
  if (!R.q) {
    if (!pool.length) {
      const e = document.createElement("div"); e.className = "card empty";
      e.innerHTML = Object.keys(S.p).length
        ? `<strong>Không còn câu cần ôn</strong><span>Làm thêm ở tab “Luyện tập” hoặc “Thi thử”, câu sai sẽ hiện ở đây.</span>`
        : `<strong>Chưa có câu sai nào</strong><span>Bắt đầu ở tab “Luyện tập”. Mỗi câu làm sai sẽ được đưa vào đây để ôn lại.</span>`;
      v.appendChild(e); keyHandler = null; return;
    }
    // avoid asking the same question twice in a row when possible
    R.q = pool.find(q => q.n !== R.last) || pool[0]; R.picked = null;
  }
  const q = R.q, box = S.p[q.n] ? S.p[q.n].b : 1;
  const card = questionCard(q, R.done + 1, R.done + Math.max(pool.length, 1), R.picked,
    i => { if (R.picked !== null) return; R.picked = i; record(q.n, i === q.ans); reviewView(); },
    () => { R.last = q.n; R.q = null; R.picked = null; R.done++; reviewView(); window.scrollTo({ top: 0 }); },
    "Câu tiếp →");
  card.querySelector(".qmeta .num").textContent = `Câu ${q.n} · hộp ${box}/3`;
  v.appendChild(card);
}

/* ---------- EXAM ---------- */
const E = { qs: [], ans: {}, cur: 0, start: 0, timer: null, submitted: false, size: S.ui.examSize ?? 50, topic: -1 };
function examSetup() {
  const v = $("#view"); v.innerHTML = ""; keyHandler = null;
  const c = document.createElement("div"); c.className = "card";
  const hist = (S.ui.exams || []).slice(-5).reverse();
  c.innerHTML = `
    <div><b>Thi thử</b><p class="note">Câu hỏi ngẫu nhiên, trộn các chủ đề như đề thật. Không hiện đáp án cho đến khi nộp bài. Khoảng 1 phút mỗi câu.</p></div>
    <div class="controls">
      <label for="eSize">Số câu <select id="eSize"><option>25</option><option>50</option><option>100</option></select></label>
      <label for="eTopic">Phạm vi <select id="eTopic"><option value="-1">Tất cả chủ đề</option>${RAW.map((t, i) => `<option value="${i}">${i + 1}. ${esc(t.t)}</option>`).join("")}</select></label>
      <button class="btn primary" id="eStart">Bắt đầu</button>
    </div>
    ${hist.length ? `<div><b style="font-size:.85rem">Lần thi gần đây</b>${hist.map(h => `<div class="note num">${new Date(h.d).toLocaleString("vi-VN")} · ${h.s}/${h.n} (${Math.round(h.s / h.n * 100)}%) · ${fmtTime(h.sec)}</div>`).join("")}</div>` : ""}`;
  v.appendChild(c);
  c.querySelector("#eSize").value = String(E.size);
  c.querySelector("#eStart").onclick = () => {
    E.size = +c.querySelector("#eSize").value; E.topic = +c.querySelector("#eTopic").value;
    S.ui.examSize = E.size; save();
    const pool = E.topic === -1 ? Q : Q.filter(q => q.t === E.topic);
    E.qs = shuffle(pool).slice(0, E.size); E.ans = {}; E.cur = 0; E.submitted = false; E.start = Date.now();
    clearInterval(E.timer); E.timer = setInterval(() => { const t = $("#eTimer"); if (t) t.textContent = fmtTime(Math.floor((Date.now() - E.start) / 1000)); }, 1000);
    examView();
  };
}
function examView() {
  const v = $("#view"); v.innerHTML = "";
  const q = E.qs[E.cur], picked = E.ans[q.n];
  const c = document.createElement("div"); c.className = "card";
  const answeredCount = Object.keys(E.ans).length;
  c.innerHTML = `
    <div class="qmeta"><span class="num">Đã làm ${answeredCount}/${E.qs.length}</span><span class="timer" id="eTimer">${fmtTime(Math.floor((Date.now() - E.start) / 1000))}</span></div>
    <div class="grid-nav">${E.qs.map((x, i) => `<button data-i="${i}" class="${E.ans[x.n] !== undefined ? "done" : ""} ${i === E.cur ? "cur" : ""}">${i + 1}</button>`).join("")}</div>
    <div class="qmeta">${chip(q.t)}<span class="num">Câu ${E.cur + 1}/${E.qs.length}</span></div>
    <p class="qtext">${esc(q.text)}</p>
    <div class="opts">${q.opts.map((o, i) => `<button class="opt ${picked === i ? "picked" : ""}" data-o="${i}"><span class="k">${L[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="nav">
      <div style="display:flex;gap:8px"><button class="btn" id="ePrev" ${E.cur ? "" : "disabled"}>← Trước</button><button class="btn" id="eNext" ${E.cur < E.qs.length - 1 ? "" : "disabled"}>Sau →</button></div>
      <div class="confirm" id="eSubmitBox"><button class="btn primary" id="eSubmit">Nộp bài</button></div>
    </div>`;
  v.appendChild(c);
  const go = i => { E.cur = Math.max(0, Math.min(E.qs.length - 1, i)); examView(); };
  const pick = i => { E.ans[q.n] = i; if (E.cur < E.qs.length - 1) go(E.cur + 1); else examView(); };
  c.querySelectorAll(".grid-nav button").forEach(b => b.onclick = () => go(+b.dataset.i));
  c.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.o));
  c.querySelector("#ePrev").onclick = () => go(E.cur - 1);
  c.querySelector("#eNext").onclick = () => go(E.cur + 1);
  c.querySelector("#eSubmit").onclick = () => {
    const left = E.qs.length - Object.keys(E.ans).length;
    if (left === 0) return submitExam();
    const box = c.querySelector("#eSubmitBox");
    box.innerHTML = `<span>Còn ${left} câu chưa làm (tính là sai).</span><button class="btn danger" id="eYes">Vẫn nộp</button><button class="btn" id="eNo">Làm tiếp</button>`;
    box.querySelector("#eYes").onclick = submitExam;
    box.querySelector("#eNo").onclick = examView;
  };
  keyHandler = e => {
    const k = e.key.toUpperCase();
    const i = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "ABCD".indexOf(k);
    if (i >= 0 && k.length === 1) { e.preventDefault(); pick(i); }
    else if (e.key === "ArrowRight") go(E.cur + 1);
    else if (e.key === "ArrowLeft") go(E.cur - 1);
  };
}
function submitExam() {
  clearInterval(E.timer); E.submitted = true; keyHandler = null;
  const sec = Math.floor((Date.now() - E.start) / 1000);
  let s = 0; E.qs.forEach(q => { const ok = E.ans[q.n] === q.ans; if (ok) s++; record(q.n, ok); });
  S.ui.exams = (S.ui.exams || []).concat({ d: Date.now(), s, n: E.qs.length, sec }).slice(-20); save();
  const pct = Math.round(s / E.qs.length * 100);
  const wrong = E.qs.filter(q => E.ans[q.n] !== q.ans);
  const v = $("#view"); v.innerHTML = "";
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = `
    <div class="score"><span class="big" style="color:var(${pct >= 90 ? "--ok" : pct >= 70 ? "--warn" : "--bad"})">${s}/${E.qs.length}</span>
      <span><b>${pct}%</b> · ${fmtTime(sec)}<br><span class="note">${pct >= 90 ? "Đạt mục tiêu 90%." : "Mục tiêu là 90%. Các câu sai đã vào tab “Ôn câu sai”."}</span></span></div>
    <div class="grid-nav">${E.qs.map((q, i) => `<button data-i="${i}" class="${E.ans[q.n] === q.ans ? "r" : "w"}" title="Câu ${q.n}">${i + 1}</button>`).join("")}</div>
    ${wrong.length ? `<b>Câu sai (${wrong.length})</b>` : "<b>Không sai câu nào.</b>"}
    ${wrong.map(q => `<div class="review-item" id="w${q.n}">${chip(q.t)}<div class="q"><span class="num">Câu ${q.n}.</span> ${esc(q.text)}</div>
      <div class="you">Bạn chọn: ${E.ans[q.n] === undefined ? "(bỏ trống)" : L[E.ans[q.n]] + ". " + esc(q.opts[E.ans[q.n]])}</div>
      <div class="ans">Đáp án: ${L[q.ans]}. ${esc(q.opts[q.ans])}</div><div class="note">${esc(q.exp)}</div></div>`).join("")}
    <div class="nav"><button class="btn" id="eBack">Đề mới</button><button class="btn primary" id="eReview">Ôn ngay các câu sai</button></div>`;
  v.appendChild(c);
  c.querySelectorAll(".grid-nav button.w").forEach(b => b.onclick = () => { const el = document.getElementById("w" + E.qs[+b.dataset.i].n); if (el) el.scrollIntoView({ behavior: "smooth" }); });
  c.querySelector("#eBack").onclick = examSetup;
  c.querySelector("#eReview").onclick = () => setView("review");
  window.scrollTo({ top: 0 });
}

/* ---------- STATS ---------- */
let resetArmed = false;
function statsView() {
  const v = $("#view"); v.innerHTML = ""; keyHandler = null;
  const c = document.createElement("div"); c.className = "card";
  const rows = RAW.map((t, ti) => {
    const qs = Q.filter(q => q.t === ti);
    let k = 0, l = 0, c2 = 0, w2 = 0;
    qs.forEach(q => { const s = status(q.n); if (s === "known") k++; else if (s === "learning") l++; const r = S.p[q.n]; if (r) { c2 += r.c; w2 += r.w; } });
    const acc = c2 + w2 ? Math.round(c2 / (c2 + w2) * 100) + "%" : "–";
    return `<div class="trow"><div class="name"><span class="chip" style="--chip:var(${CHIP[ti]})">${ti + 1}. ${esc(t.t)}</span><br><small>${k} thuộc · ${l} cần ôn · ${qs.length - k - l} chưa làm</small></div>
      <div class="pct">đúng ${acc}<br><button class="btn go" data-t="${ti}" style="padding:4px 10px;font-size:.78rem">Luyện</button></div>
      <div class="bar"><span style="width:${k / qs.length * 100}%;background:var(--ok)"></span><span style="width:${l / qs.length * 100}%;background:var(--bad)"></span></div></div>`;
  }).join("");
  c.innerHTML = `<b>Tiến độ theo chủ đề</b><div>${rows}</div>
    <p class="note">Tiến độ chỉ lưu trong trình duyệt này. Xoá dữ liệu trang hoặc mở ở thiết bị khác sẽ bắt đầu lại từ đầu.</p>
    <div class="confirm" id="resetBox"><button class="btn danger" id="reset">Xoá toàn bộ tiến độ</button></div>`;
  v.appendChild(c);
  c.querySelectorAll(".go").forEach(b => b.onclick = () => { P.topic = +b.dataset.t; P.filter = "notknown"; buildPractice(); setView("practice"); });
  c.querySelector("#reset").onclick = () => {
    const box = c.querySelector("#resetBox");
    box.innerHTML = `<span>Xoá hết kết quả của 500 câu và lịch sử thi?</span><button class="btn danger" id="rYes">Xoá</button><button class="btn" id="rNo">Huỷ</button>`;
    box.querySelector("#rYes").onclick = () => { S = { p: {}, ui: {} }; save(); renderMeter(); buildPractice(); statsView(); };
    box.querySelector("#rNo").onclick = statsView;
  };
}

/* ---------- routing ---------- */
let view = "practice";
function setView(name) {
  if (view === "exam" && name !== "exam" && E.timer && !E.submitted) { /* keep exam running in background */ }
  view = name;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === name)));
  if (name === "practice") practiceView();
  else if (name === "review") reviewView();
  else if (name === "exam") (E.qs.length && !E.submitted ? examView() : examSetup());
  else statsView();
  try { S.ui.view = name; save(); } catch (e) {}
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
buildPractice();
renderMeter();
setView(location.hash === "#exam" ? "exam" : location.hash === "#review" ? "review" : (S.ui.view === "stats" ? "stats" : "practice"));
</script>
